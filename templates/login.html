{% extends 'base.html' %}
{% block title %}Login | CivicShield AI{% endblock %}
{% block content %}
<main class="auth-shell">
    <div class="auth-card">
        <h2>Login</h2>
        <form method="post" action="{{ url_for('login') }}" class="auth-form">
            <label>
                Email
                <input type="email" name="email" required />
            </label>
            <label>
                Password
                <input type="password" name="password" required />
            </label>
            <button type="submit" class="primary-btn block-btn">Login</button>
        </form>

        <div class="quick-report-box">
            <p>🚨 Quick Emergency Report</p>
            <a href="{{ url_for('report_page') }}" class="secondary-btn block-btn">Report without logging in</a>
        </div>
    </div>
</main>
{% endblock %}
